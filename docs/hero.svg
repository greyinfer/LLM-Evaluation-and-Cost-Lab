<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#8DB19E" stroke-width="1.8" stroke-linecap="round"/></marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E2EAE5" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="440" rx="24" fill="#F3F6F4"/>
  <rect width="1200" height="440" rx="24" fill="url(#grid)" opacity=".7"/>
  <text x="60" y="78" font-size="40" font-weight="700" fill="#16294A">LLM Evaluation &amp; Cost Lab</text>
  <text x="60" y="114" font-size="19" fill="#45554F">Cut the cost of an AI workflow without losing quality, and prove it.</text>
  <g font-size="13" font-weight="600" fill="#226347">
    <rect x="60" y="134" width="150" height="26" rx="13" fill="#E2EEE7"/><text x="135" y="152" text-anchor="middle">24 insurance tasks</text>
    <rect x="220" y="134" width="120" height="26" rx="13" fill="#E2EEE7"/><text x="280" y="152" text-anchor="middle">3 strategies</text>
    <rect x="350" y="134" width="262" height="26" rx="13" fill="#E2EEE7"/><text x="481" y="152" text-anchor="middle">Bring your own Gemini or Claude key</text>
  </g>
  <!-- tasks card -->
  <rect x="50" y="196" width="244" height="196" rx="16" fill="#FFFFFF" stroke="#D6E0DA"/>
  <text x="72" y="226" font-size="12" font-weight="700" fill="#45554F" letter-spacing="1.5">THE TEST SET</text>
  <g font-size="15" fill="#173A30">
    <rect x="70" y="242" width="204" height="38" rx="10" fill="#EDF3EF"/><text x="84" y="266"><tspan font-weight="700">8</tspan> classify messages</text>
    <rect x="70" y="288" width="204" height="38" rx="10" fill="#EDF3EF"/><text x="84" y="312"><tspan font-weight="700">8</tspan> extract claim data</text>
    <rect x="70" y="334" width="204" height="38" rx="10" fill="#EDF3EF"/><text x="84" y="358"><tspan font-weight="700">8</tspan> answer policy questions</text>
  </g>
  <!-- arrows to lanes -->
  <path d="M296 294 C326 294 326 224 356 224" fill="none" stroke="#8DB19E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M296 294 L356 294" fill="none" stroke="#8DB19E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M296 294 C326 294 326 364 356 364" fill="none" stroke="#8DB19E" stroke-width="2" marker-end="url(#ah)"/>
  <!-- lanes -->
  <rect x="360" y="196" width="440" height="56" rx="14" fill="#FFFFFF" stroke="#16294A" stroke-width="1.5"/>
  <text x="384" y="220" font-size="17" font-weight="700" fill="#16294A">Baseline</text>
  <text x="384" y="241" font-size="13.5" fill="#45554F">Strong model, whole document, step-by-step reasoning</text>
  <rect x="360" y="266" width="440" height="56" rx="14" fill="#2E7D5B"/>
  <text x="384" y="290" font-size="17" font-weight="700" fill="#FFFFFF">Optimised</text>
  <text x="384" y="311" font-size="13.5" fill="#E2EEE7">Route, retrieve, cap, cache, validate, repair, escalate</text>
  <rect x="360" y="336" width="440" height="56" rx="14" fill="#FFFFFF" stroke="#E0A42B" stroke-width="1.5"/>
  <text x="384" y="360" font-size="17" font-weight="700" fill="#8A5A06">Reflection</text>
  <text x="384" y="381" font-size="13.5" fill="#45554F">A second review pass on hard tasks, with its cost measured</text>
  <!-- arrows to scorecard -->
  <path d="M802 224 C840 224 840 294 876 294" fill="none" stroke="#8DB19E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M802 294 L876 294" fill="none" stroke="#8DB19E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M802 364 C840 364 840 294 876 294" fill="none" stroke="#8DB19E" stroke-width="2" marker-end="url(#ah)"/>
  <!-- scorecard -->
  <rect x="880" y="196" width="260" height="196" rx="16" fill="#16294A"/>
  <text x="904" y="226" font-size="12" font-weight="700" fill="#E0A42B" letter-spacing="1.5">THE SCORECARD</text>
  <g font-size="15.5" fill="#FFFFFF">
    <circle cx="914" cy="259" r="9" fill="none" stroke="#8DB19E" stroke-width="2"/><path d="M909.5 259l3 3 6-6" fill="none" stroke="#8DB19E" stroke-width="2" stroke-linecap="round"/><text x="934" y="264">Quality and pass rate</text>
    <circle cx="914" cy="295" r="9" fill="none" stroke="#8DB19E" stroke-width="2"/><text x="914" y="300" font-size="11" text-anchor="middle" fill="#8DB19E" font-weight="700">T</text><text x="934" y="300">Tokens per task</text>
    <circle cx="914" cy="331" r="9" fill="none" stroke="#E0A42B" stroke-width="2"/><text x="914" y="336" font-size="11" text-anchor="middle" fill="#E0A42B" font-weight="700">$</text><text x="934" y="336">Cost per run</text>
    <circle cx="914" cy="367" r="9" fill="none" stroke="#8DB19E" stroke-width="2"/><path d="M914 361v6l4 3" fill="none" stroke="#8DB19E" stroke-width="2" stroke-linecap="round"/><text x="934" y="372">Speed</text>
  </g>
</svg>
